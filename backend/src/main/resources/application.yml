server:
  tomcat:
    mbeanregistry:
      enabled: true   # exposes tomcat_threads_* metrics for the Grafana dashboard
    # EMQX calls /api/mqtt/auth and /api/mqtt/acl over a few long-lived, pipelined HTTP connections. Tomcat's default
    # closes a connection after 100 requests, which cut requests in flight ("The connection was lost") and made EMQX
    # mark the HTTP resource as not connected, refusing devices with NOT_AUTHORIZED without asking the backend.
    max-keep-alive-requests: ${IOT_TOMCAT_MAX_KEEPALIVE_REQUESTS:-1}
    keep-alive-timeout: ${IOT_TOMCAT_KEEPALIVE_TIMEOUT:120s}
    threads:
      max: ${IOT_TOMCAT_THREADS:400}
    accept-count: ${IOT_TOMCAT_ACCEPT_COUNT:500}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: iot-backend
  task:
    scheduling:
      # one thread for every @Scheduled job: a slow job (retention purge, business metrics) would delay the
      # device offline sweep and the last-comm flush, which both sit on the ingestion side
      pool:
        size: ${IOT_SCHEDULER_THREADS:4}
  datasource:
    # stringtype=unspecified lets plain Strings be written into JSONB columns
    url: ${IOT_DB_URL:jdbc:postgresql://localhost:5432/iot?stringtype=unspecified}
    username: ${IOT_DB_USER:iot}
    password: ${IOT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${IOT_DB_POOL:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  kafka:
    bootstrap-servers: ${IOT_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: ${IOT_KAFKA_ACKS:1}
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        linger.ms: 5
        max.block.ms: 3000
    consumer:
      auto-offset-reset: latest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  metrics:
    tags:
      application: iot-backend
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${IOT_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${IOT_API_DOCS_ENABLED:false}

iot:
  security:
    # REQUIRED outside the `local` profile: at least 32 characters, never commit a real value.
    jwt-secret: ${IOT_JWT_SECRET:}
    jwt-ttl-minutes: ${IOT_JWT_TTL_MINUTES:120}
  admin:
    username: ${IOT_ADMIN_USERNAME:admin}
    # The admin account is only created when this is set and no users exist yet.
    initial-password: ${IOT_ADMIN_PASSWORD:}
  cors-allowed-origins: ${IOT_CORS_ORIGINS:}
  metrics:
    # bearer token for /actuator/prometheus (Prometheus scrape); empty = endpoint closed
    token: ${IOT_METRICS_TOKEN:}
  mqtt:
    broker-url: ${IOT_MQTT_BROKER_URL:tcp://localhost:1883}
    platform-username: ${IOT_MQTT_USERNAME:platform}
    platform-password: ${IOT_MQTT_PASSWORD:}
    client-id: ${IOT_MQTT_CLIENT_ID:iot-platform-${random.uuid}}
    # secret shared with the broker's HTTP auth plugin (EMQX) calling /api/mqtt/auth and /api/mqtt/acl
    http-auth-token: ${IOT_MQTT_HTTP_AUTH_TOKEN:}
    subscribe-qos: ${IOT_MQTT_SUBSCRIBE_QOS:1}
    # The uplink topics are consumed by this many connections in one shared subscription ($share/<group>/<filter>).
    # One connection is one broker session with one queue: a few thousand messages per second fill it and the broker
    # starts dropping (docs/ingest.md §3). Set to 1 for brokers without shared subscriptions.
    ingest-connections: ${IOT_MQTT_INGEST_CONNECTIONS:16}
    # Paho's outbound window (platform -> device commands). It does not limit what the broker delivers; the uplink
    # receive window is the broker's mqtt.max_inflight (EMQX_MAX_INFLIGHT in docker-compose.yml).
    max-inflight: ${IOT_MQTT_MAX_INFLIGHT:4096}
    shared-group: ${IOT_MQTT_SHARED_GROUP:ingest}
    # true: the broker keeps no session for this client after it disconnects. The client id is random per start, so a
    # persistent session could never be resumed and every restart would leave an orphan session that keeps queueing
    # (and dropping) all uplink messages in the broker. Subscriptions are re-established on every connect anyway.
    clean-session: ${IOT_MQTT_CLEAN_SESSION:true}
    embedded-broker:
      enabled: false
      host: 0.0.0.0
      port: 1883
  history:
    # where property history goes: postgres | influxdb
    store: ${IOT_HISTORY_STORE:postgres}
  influxdb:
    # InfluxDB 1.x, used when iot.history.store=influxdb
    url: ${IOT_INFLUX_URL:http://localhost:8086}
    database: ${IOT_INFLUX_DB:iot}
    username: ${IOT_INFLUX_USER:}
    password: ${IOT_INFLUX_PASSWORD:}
    retention-policy: ${IOT_INFLUX_RP:}
    create-database: ${IOT_INFLUX_CREATE_DB:false}
    retention-days: ${IOT_INFLUX_RETENTION_DAYS:0}
  ingest:
    # direct (default): MQTT -> in-process lanes -> processing.  kafka: MQTT -> Kafka -> consumer -> processing.
    mode: ${IOT_INGEST_MODE:direct}
    lanes: ${IOT_INGEST_LANES:0}
    lane-queue: ${IOT_INGEST_LANE_QUEUE:20000}
    # block (default): a full lane makes the MQTT callback wait (nothing lost, back-pressure towards the broker)
    # drop: drop and count the message instead (iot_ingest_lane_dropped_total) so the broker connection stays fast
    lane-overflow: ${IOT_LANE_OVERFLOW:block}
    # write the "latest value" of one device property at most this often (ms; trailing flush keeps it current).
    # 0 = write every report. This single table was the largest write amplification of ingestion.
    latest-min-interval-ms: ${IOT_LATEST_MIN_INTERVAL_MS:1000}
    # separate connection pool for all ingestion writes; the main pool is left to the HTTP/API requests.
    # 0 = share the main pool (previous behaviour)
    db-pool: ${IOT_INGEST_DB_POOL:12}
    # a batch writer waits this long for a connection before it gives up and counts the batch as dropped
    db-timeout-ms: ${IOT_INGEST_DB_TIMEOUT_MS:2000}
    # PostgreSQL synchronous_commit for the ingestion pool only (on | off | local | remote_write | remote_apply).
    # off: a batch commit no longer waits for the WAL to reach the disk. With fsync per batch the writers sit in
    # pg_stat_activity WALWrite waits and that wait caps the whole ingestion pipeline (see docs/ingest.md).
    # Trade-off: on an OS crash the last few hundred ms of telemetry writes are lost; the database stays consistent.
    synchronous-commit: ${IOT_INGEST_SYNCHRONOUS_COMMIT:off}
    batch:
      queue-capacity: ${IOT_BATCH_QUEUE:200000}
      max-batch: ${IOT_BATCH_MAX:2000}
      history-max-batch: ${IOT_BATCH_HISTORY_MAX:5000}
      # after the first item of a batch arrives, keep collecting this long before writing (0 = write immediately).
      # Without it the batch size settles at "arrival rate x write duration", i.e. it shrinks exactly when the sink
      # gets slower. 50ms gives the writers roughly 10x larger batches and far fewer commits/WAL syncs per row.
      linger-ms: ${IOT_BATCH_LINGER_MS:50}
      # parallel writer threads per queue (spread by device id); 1 = a single writer
      workers: ${IOT_BATCH_WORKERS:4}
      history-workers: ${IOT_BATCH_HISTORY_WORKERS:4}
      log-workers: ${IOT_BATCH_LOG_WORKERS:2}
      # Off: iot_device_message_log is a full detail log that caps ingest at ~4.2k rows/s and grows ~13 GB/hour at
      # 10k msg/s (docs/perf-ingest-retro.md §7). The dashboard trend under-counts while this is off.
      log-ok-property: ${IOT_LOG_OK_PROPERTY:false}
    kafka:
      topic: ${IOT_KAFKA_TOPIC:iot-uplink}
      group-id: ${IOT_KAFKA_GROUP:iot-platform}
      concurrency: ${IOT_KAFKA_CONCURRENCY:8}
      create-topic: ${IOT_KAFKA_CREATE_TOPIC:true}
      partitions: ${IOT_KAFKA_PARTITIONS:8}
      replicas: ${IOT_KAFKA_REPLICAS:1}
  device:
    offline-sweep-seconds: 15
    dedup-cache-size: 20000
    auth-cache-warmup: ${IOT_AUTH_CACHE_WARMUP:true}
    auth-cache-refresh-seconds: ${IOT_AUTH_CACHE_REFRESH_SECONDS:300}
    auth-cache-max: ${IOT_AUTH_CACHE_MAX:200000}
  alarm:
    # rules are evaluated on a dedicated worker, never on the MQTT lane (see AlarmEngine)
    rule-refresh-seconds: ${IOT_ALARM_RULE_REFRESH_SECONDS:30}
    # when the worker falls behind, evaluations are dropped and counted (iot_alarm_eval_dropped_total)
    queue-capacity: ${IOT_ALARM_QUEUE_CAPACITY:50000}
    # trigger_count / last_triggered_at of ACTIVE alarms are merged and written this often (ms)
    flush-ms: ${IOT_ALARM_FLUSH_MS:1000}
  ws:
    # WebSocket writes happen on this pool; a slow browser must not slow the ingestion lanes
    sender-threads: ${IOT_WS_SENDER_THREADS:2}
    queue-capacity: ${IOT_WS_QUEUE_CAPACITY:20000}
    # property pushes of one device are merged within this window (ms); 0 = push every message
    coalesce-millis: ${IOT_WS_COALESCE_MILLIS:200}
  # how long the dashboard aggregates (overview / trend / top devices) are cached, in seconds; 0 = always read
  dashboard-cache-seconds: ${IOT_DASHBOARD_CACHE_SECONDS:10}
  embedded-postgres:
    enabled: false
    port: 15432
    data-dir: ./data/pgdata

logging:
  level:
    root: INFO
    com.omnihub: INFO
