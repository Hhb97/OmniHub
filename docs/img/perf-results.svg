<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <text x="24" y="30" font-size="17" font-weight="600" fill="#0f172a">修复前后对比（10000 台 × 1 条/秒，持续 120s）</text>
  <text x="24" y="50" font-size="12" fill="#64748b">同一份压测脚本、同一台 16 核虚拟机；修复前取 stage K/M/N/O 中位数，修复后取 stage P</text>

  <!-- panel A -->
  <g>
    <rect x="24" y="70" width="446" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="96" font-size="13" font-weight="600" fill="#0f172a">后端实际处理吞吐</text>
    <text x="44" y="114" font-size="11" fill="#94a3b8">单位 msg/s，EMQX 投递 ≈ 后端处理</text>

    <text x="44" y="148" font-size="11.5" fill="#64748b">修复前</text>
    <rect x="110" y="136" width="77" height="20" rx="3" fill="#dc2626" opacity="0.85"/>
    <text x="197" y="151" font-size="12" font-weight="600" fill="#b91c1c">2 600</text>

    <text x="44" y="186" font-size="11.5" fill="#64748b">修复后</text>
    <rect x="110" y="174" width="280" height="20" rx="3" fill="#16a34a" opacity="0.85"/>
    <text x="398" y="189" font-size="12" font-weight="600" fill="#15803d">9 400</text>

    <text x="44" y="230" font-size="12" font-weight="600" fill="#15803d">×3.6，且不再随压测时长抖动</text>
    <text x="44" y="250" font-size="11" fill="#94a3b8">修复前受 WALWrite 限制，吞吐随 PG 检查点波动</text>
  </g>

  <!-- panel B -->
  <g>
    <rect x="510" y="70" width="446" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="530" y="96" font-size="13" font-weight="600" fill="#0f172a">客户端确认延迟 P95</text>
    <text x="530" y="114" font-size="11" fill="#94a3b8">单位 ms，从发布到收到 QoS1 PUBACK</text>

    <text x="530" y="148" font-size="11.5" fill="#64748b">修复前</text>
    <rect x="596" y="136" width="280" height="20" rx="3" fill="#dc2626" opacity="0.85"/>
    <text x="640" y="151" font-size="12" font-weight="600" fill="#ffffff">9 801 ms</text>

    <text x="530" y="186" font-size="11.5" fill="#64748b">修复后</text>
    <rect x="596" y="174" width="6" height="20" rx="3" fill="#16a34a" opacity="0.85"/>
    <text x="612" y="189" font-size="12" font-weight="600" fill="#15803d">19 ms</text>

    <text x="530" y="230" font-size="12" font-weight="600" fill="#15803d">≈ 1/500，链路从"排队数秒"回到"实时"</text>
    <text x="530" y="250" font-size="11" fill="#94a3b8">延迟高是队列积压的表现，不是网络问题</text>
  </g>

  <!-- panel C -->
  <g>
    <rect x="24" y="286" width="446" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="312" font-size="13" font-weight="600" fill="#0f172a">客户端失败消息数（2 分钟累计）</text>
    <text x="44" y="330" font-size="11" fill="#94a3b8">超时未确认 + 断连重连导致的丢弃</text>

    <text x="44" y="364" font-size="11.5" fill="#64748b">修复前</text>
    <rect x="110" y="352" width="280" height="20" rx="3" fill="#dc2626" opacity="0.85"/>
    <text x="130" y="367" font-size="12" font-weight="600" fill="#ffffff">34 204 条</text>

    <text x="44" y="402" font-size="11.5" fill="#64748b">修复后</text>
    <text x="110" y="403" font-size="12" font-weight="600" fill="#15803d">0 条（sent 849 936 / acked 849 600）</text>

    <text x="44" y="446" font-size="12" font-weight="600" fill="#15803d">零丢弃，曲线不再"上不去就崩"</text>
    <text x="44" y="466" font-size="11" fill="#94a3b8">修复前相同档位还有 1 500–2 700 次重连</text>
  </g>

  <!-- panel D -->
  <g>
    <rect x="510" y="286" width="446" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="530" y="312" font-size="13" font-weight="600" fill="#0f172a">最新值每批写入行数</text>
    <text x="530" y="330" font-size="11" fill="#94a3b8">批量 = 到达速率 × 上一次写入耗时（恶性循环）</text>

    <text x="530" y="364" font-size="11.5" fill="#64748b">修复前</text>
    <rect x="596" y="352" width="39" height="20" rx="3" fill="#dc2626" opacity="0.85"/>
    <text x="645" y="367" font-size="12" font-weight="600" fill="#b91c1c">135 行 / 24ms</text>

    <text x="530" y="402" font-size="11.5" fill="#64748b">修复后</text>
    <rect x="596" y="390" width="280" height="20" rx="3" fill="#16a34a" opacity="0.85"/>
    <text x="886" y="405" font-size="12" font-weight="600" fill="#15803d">981</text>

    <text x="530" y="440" font-size="12" font-weight="600" fill="#15803d">7.3 倍/批，commit 与 fsync 次数同比下降</text>
    <text x="530" y="460" font-size="11" fill="#94a3b8">history 队列：221 点 → 2 226 点/批，从丢 88.8 万行到零丢弃</text>
    <text x="530" y="478" font-size="11" fill="#94a3b8">latest 单条写入能力：约 2.7 万行/s → 约 10.7 万行/s</text>
  </g>

  <text x="24" y="516" font-size="11.5" fill="#475569">读法：四个面板分别对应"吞吐 / 延迟 / 可靠性 / 写放大"。只提升吞吐而延迟或丢弃变差，说明只是把队列挪了个位置。</text>
  <text x="24" y="536" font-size="11.5" fill="#b91c1c">注：绿色数字取自"关日志 + 16 连接"；默认配置（写日志 + 4 连接）复测仅 2.0k msg/s、失败 39 990 条 —— 见 §7。</text>
</svg>
