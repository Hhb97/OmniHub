apiVersion: 1

# $VARIABLES are expanded by Grafana from its environment (set in docker-compose.yml).
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: InfluxDB (iot)
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: $INFLUX_DB
    user: $INFLUX_USER
    editable: false
    jsonData:
      httpMode: GET
    secureJsonData:
      password: $INFLUX_PASSWORD
