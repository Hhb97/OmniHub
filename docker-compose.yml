# Production-style stack: PostgreSQL + EMQX + InfluxDB 1.8 + backend + frontend (nginx).
# Usage: cp .env.example .env && edit .env && docker compose up -d --build
#        then, once EMQX is up:  sh deploy/emqx-bootstrap.sh   (configures device auth, see docs/deploy-docker.md)
#
# Only these ports are published on the host: WEB_PORT (frontend), MQTT_PORT (devices), EMQX_DASHBOARD_PORT,
# GRAFANA_PORT (monitoring), plus 9100 (node-exporter, host network).
# PostgreSQL and InfluxDB stay on the internal network.
#
# NOTE: written for, but not yet verified on, a real Docker host (the development machine has no Docker).
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot}
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # The image's defaults (128 MB of shared buffers, 1 GB of WAL between checkpoints, ...) are meant for a laptop.
    # At thousands of messages per second (about 25000 row updates per second) they caused "checkpoints are occurring
    # too frequently" and backends writing buffers themselves, and the whole write path stalled. See docs/tuning.md.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-8GB}
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_buffers=64MB
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - autovacuum_naptime=15s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_vacuum_cost_limit=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot} -d ${POSTGRES_DB:-iot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUX_DB:-iot}
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: ${INFLUX_USER:-influx}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
    volumes:
      - influxdata:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.8.0}
    restart: unless-stopped
    environment:
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
      # Device authentication / topic ACL are delegated to the backend. They are applied by deploy/emqx-bootstrap.sh
      # (EMQX REST API) after start-up, which is easier to verify and to repair than environment overrides.
      EMQX_AUTHORIZATION__NO_MATCH: deny
      # Limits for the platform's single subscription, which receives every device message (docs/tuning.md §EMQX).
      # With EMQX's defaults (inflight window 32, queue 1000, mailbox 1000) it drops deliveries and EMQX shuts the
      # connection down with "mailbox_overflow" at a few thousand messages per second.
      EMQX_MQTT__MAX_INFLIGHT: ${EMQX_MAX_INFLIGHT:-1024}
      EMQX_MQTT__MAX_MQUEUE_LEN: ${EMQX_MAX_MQUEUE_LEN:-100000}
      EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE: ${EMQX_MAX_MAILBOX_SIZE:-100000}
      EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE: ${EMQX_MAX_HEAP_SIZE:-512MB}
      EMQX_LISTENERS__TCP__DEFAULT__TCP_OPTIONS__BACKLOG: ${EMQX_TCP_BACKLOG:-4096}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Only used when IOT_INGEST_MODE=kafka (docs/kafka-ingest.md).
  # Not published: the backend and kafka-exporter reach it as kafka:9092 inside the compose network.
  # Retention is capped by size per partition so a load test cannot fill the disk of a small host.
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:-268435456}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-6}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      emqx:
        condition: service_started
    environment:
      SERVER_PORT: 8080   # fixed: nginx, the healthcheck and EMQX callbacks all use 8080 inside the network
      IOT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iot}?stringtype=unspecified
      IOT_DB_USER: ${POSTGRES_USER:-iot}
      IOT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      IOT_JWT_SECRET: ${IOT_JWT_SECRET:?set IOT_JWT_SECRET in .env}
      IOT_ADMIN_USERNAME: ${IOT_ADMIN_USERNAME:-admin}
      IOT_ADMIN_PASSWORD: ${IOT_ADMIN_PASSWORD:?set IOT_ADMIN_PASSWORD in .env}
      IOT_MQTT_BROKER_URL: tcp://emqx:1883
      IOT_MQTT_USERNAME: ${IOT_MQTT_USERNAME:-platform}
      IOT_MQTT_PASSWORD: ${IOT_MQTT_PASSWORD:?set IOT_MQTT_PASSWORD in .env}
      IOT_MQTT_HTTP_AUTH_TOKEN: ${IOT_MQTT_HTTP_AUTH_TOKEN:?set IOT_MQTT_HTTP_AUTH_TOKEN in .env}
      IOT_CORS_ORIGINS: ${IOT_CORS_ORIGINS:-}
      IOT_DASHBOARD_ZONE: ${IOT_DASHBOARD_ZONE:-UTC}
      IOT_API_DOCS_ENABLED: ${IOT_API_DOCS_ENABLED:-false}
      # history store: influxdb (default in this stack) or postgres
      IOT_HISTORY_STORE: ${IOT_HISTORY_STORE:-influxdb}
      IOT_INFLUX_URL: http://influxdb:8086
      IOT_INFLUX_DB: ${INFLUX_DB:-iot}
      IOT_INFLUX_USER: ${INFLUX_USER:-influx}
      IOT_INFLUX_PASSWORD: ${INFLUX_PASSWORD}
      IOT_INFLUX_CREATE_DB: "true"
      IOT_INFLUX_RETENTION_DAYS: ${IOT_INFLUX_RETENTION_DAYS:-90}
      # throughput settings (see docs/tuning.md); defaults are fine to start with
      IOT_INGEST_MODE: ${IOT_INGEST_MODE:-direct}
      IOT_KAFKA_BOOTSTRAP: kafka:9092
      IOT_KAFKA_TOPIC: ${IOT_KAFKA_TOPIC:-iot-uplink}
      IOT_KAFKA_GROUP: ${IOT_KAFKA_GROUP:-iot-platform}
      IOT_KAFKA_CONCURRENCY: ${IOT_KAFKA_CONCURRENCY:-8}
      IOT_KAFKA_PARTITIONS: ${IOT_KAFKA_PARTITIONS:-8}
      IOT_KAFKA_ACKS: ${IOT_KAFKA_ACKS:-1}
      IOT_METRICS_TOKEN: ${IOT_METRICS_TOKEN:?set IOT_METRICS_TOKEN in .env}
      IOT_LOG_OK_PROPERTY: ${IOT_LOG_OK_PROPERTY:-true}
      IOT_DB_POOL: ${IOT_DB_POOL:-40}
      IOT_BATCH_WORKERS: ${IOT_BATCH_WORKERS:-4}
      IOT_BATCH_HISTORY_WORKERS: ${IOT_BATCH_HISTORY_WORKERS:-2}
      IOT_BATCH_LOG_WORKERS: ${IOT_BATCH_LOG_WORKERS:-2}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=70}
    healthcheck:
      test: ["CMD-SHELL", "(curl -sf http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/actuator/health) | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8088}:80"

  # ---------------------------------------------------------------- monitoring (docs/monitoring.md)
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    restart: unless-stopped
    # credentials are written to files from the environment at start-up; prometheus.yml references the files
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$IOT_METRICS_TOKEN" > /tmp/metrics_token
        printf '%s' "$$INFLUX_USER" > /tmp/influx_user
        printf '%s' "$$INFLUX_PASSWORD" > /tmp/influx_password
        printf '%s' "$$EMQX_API_KEY" > /tmp/emqx_api_key
        printf '%s' "$$EMQX_API_SECRET" > /tmp/emqx_api_secret
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION:-15d}
    environment:
      IOT_METRICS_TOKEN: ${IOT_METRICS_TOKEN}
      INFLUX_USER: ${INFLUX_USER:-influx}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD}
      EMQX_API_KEY: ${EMQX_API_KEY:-}
      EMQX_API_SECRET: ${EMQX_API_SECRET:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Kafka topic offsets and consumer-group lag (the broker itself exposes no Prometheus metrics)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Host network on purpose: network and TCP figures must be the host's, not a container's.
  # It listens on :9100 on every interface of the host: restrict it with the firewall to trusted machines.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/omnihub-platform.json
      INFLUX_DB: ${INFLUX_DB:-iot}
      INFLUX_USER: ${INFLUX_USER:-influx}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  influxdata:
  emqxdata:
  kafkadata:
  promdata:
  grafanadata:
